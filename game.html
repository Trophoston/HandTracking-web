<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finger Shape Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap');

    body {
      margin: 0;

      font-family: "IBM Plex Sans", sans-serif;
      background: linear-gradient(to right, #2e003e, #1a1a40);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      /* Prevent scrollbars */
    }

    .ui-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 1200px;
      padding: 1rem;
      box-sizing: border-box;
      /* Include padding in width */
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .top-bar button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      background-color: #5f27cd;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    .zones {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
    }

    .zone {
      flex: 1;
      background-color: #341f97;
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      box-sizing: border-box;

      transform: scaleX(-1);
    }

    .output_canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      transform: scaleX(-1);
      /* Flip horizontally for mirror effect */
    }

    .shape-box {
      width: 100px;
      height: 100px;
      background-color: white;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    .score-timer {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-size: 1.5rem;
    }

    .out_box {
      position: absolute;
      filter: drop-shadow(0 0 0.75rem #ddd) opacity(.8);
    }

    /* Start and Game Over Screens */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #5f27cd;
    }

    .overlay p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      max-width: 600px;
    }

    .overlay button {
      padding: 1rem 2rem;
      font-size: 1.5rem;
      border: none;
      border-radius: 8px;
      background-color: #5f27cd;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .overlay button:hover {
      background-color: #4b1fad;
    }

    .tutorial-shapes {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tutorial-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .tutorial-item .shape-box {
      border: 2px dashed #9e5de8;
    }

    #gameOverScreen h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #5f27cd;
    }

    #gameOverScreen p {
      font-size: 1.8rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .zones {
        flex-direction: column;
        align-items: center;
      }

      .overlay h1 {
        font-size: 2.5rem;
      }

      .overlay button {
        font-size: 1.2rem;
        padding: 0.8rem 1.5rem;
      }

      .tutorial-shapes {
        flex-direction: column;
        gap: 1rem;
      }

      .tutorial-item p {
        font-size: 1rem;
      }
    }

    .tutorial-shapes {
      width: 190px;
      height: 190px;

      background-color: white;
      border-radius: 10px;
    }



    .tutorial-shapes img {
      width: 200px;
      height: 200px;

      transform: scale(1.2);

      /* background-color: white; */
    }

    .tutorial-shapes p {
      transform: scaleX(-1);

      margin: 0;
      padding: 0;

    }
  </style>
</head>

<body>
  <div class="ui-container" id="gameContainer" style="display: none;">
    <div class="top-bar">
      <div style="display: none;">
        <button id="visc">Toggle Camera View</button>
        <button id="switchCameraButton">Switch Camera</button>
      </div>

      <h1>Finger Shape Game!</h1>


      <div class="score-timer">
        <span>คะแนน: <span id="score">0</span></span>
        <span>เวลา: <span id="time">30</span>s</span>
      </div>
    </div>

    <div class="zones">
      <div class="zone camera-zone">
        <video class="input_video" style="display: none;"></video>
        <canvas class="output_canvas" width="640px" height="480px"></canvas>

        <div class="shape-box out_box" id="shapeBox"></div>
      </div>

      <div class="zone task-zone">
        <!-- <h3>Target Shape</h3> -->
        <div class="shape-box" id="targetBox"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <h1>Finger Shape Game!</h1>

    <div class="zone camera-zone"
      style="height: 10vh; width: 70%; margin: 20px; display: flex; flex-direction: row; align-items: center; justify-content: space-evenly;">

      <div class="tutorial-shapes">
        <img src="./src/1.png">
        <p>นิ้วชี้ - ควบคุมสี</p>
      </div>

      <div class="tutorial-shapes">
        <img src="./src/2.png">
        <p>นิ้วกลาง - ควบรูปทรง</p>
      </div>

      <div class="tutorial-shapes">
        <img src="./src/3.png">
        <p>นิ้วนาง - ควบคุมขนาด</p>
      </div>
    </div>

    <p>ใช้นิ้วมือในการควบคุมรูปทรงบนหน้าจอให้ตรงกับรูปทรงเป้าหมายเพื่อรับคะแนน คุณมีเวลาเพียง 30
      วินาทีใช้ให้คุ้มค่าน้าาา</p>
    <button id="startButton">เริ่มเกม</button>
  </div>

  <div class="overlay" id="gameOverScreen" style="display: none;">
    <h2 id="specialtext">จบเกม!</h2>
    <p>คะแนนของคุณ : <span id="finalScore">0</span></p>
    <button id="replayButton">เล่นอีกครั้ง</button>
  </div>

  <script type="module">
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const shapeBox = document.getElementById('shapeBox');
    const targetBox = document.getElementById('targetBox');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const gameContainer = document.getElementById('gameContainer');
    const startScreen = document.getElementById('startScreen');
    const startButton = document.getElementById('startButton');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const specialText = document.getElementById('specialtext');
    const replayButton = document.getElementById('replayButton');

    // make func for replay button that will go to startScreen and reset game state
    replayButton.addEventListener('click', () => {
      gameOverScreen.style.display = 'none';
      startScreen.style.display = 'flex';
      score = 0;
      timeLeft = 30;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      gameOver = true; // Reset game state
      clearInterval(countdownInterval); // Clear any existing countdown
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop()); // Stop current stream
        currentStream = null; // Reset stream
      }
      cameraStarted = false; // Reset camera state
      cameraIndex = 0; // Reset camera index
      setNewTarget(); // Reset target shape
      shapeBox.style.display = 'none'; // Hide shape box
    });


    let currentStream;
    let cameraIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let gameOver = true; // Start as true so game doesn't run until start button is pressed
    let countdownInterval;
    let cameraStarted = false; // Track if camera has been initialized

    const targets = [
      { color: 'white', radius: '0px', scale: 1 },
      { color: 'white', radius: '100px', scale: 1 },
      { color: 'white', radius: '100px', scale: 1.8 },
      { color: 'black', radius: '100px', scale: 1.8 },
      { color: 'black', radius: '0px', scale: 1 },
      { color: 'white', radius: '0px', scale: 1.8 },
      { color: 'black', radius: '100px', scale: 1 },
      { color: 'white', radius: '100px', scale: 1 },
      { color: 'white', radius: '0px', scale: 1 }
    ];

    let currentTarget = {};

    function setNewTarget() {
      currentTarget = targets[Math.floor(Math.random() * targets.length)];
      targetBox.style.backgroundColor = currentTarget.color;
      targetBox.style.borderRadius = currentTarget.radius;
      targetBox.style.transform = `scale(${currentTarget.scale})`;
    }

    function matchShapes(user) {
      return (
        user.color === currentTarget.color &&
        user.radius === currentTarget.radius &&
        user.scale === currentTarget.scale
      );
    }

    async function getCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter(device => device.kind === 'videoinput');
    }

    async function startStream(cameraId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            deviceId: cameraId ? { exact: cameraId } : undefined,
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;
        cameraStarted = true; // Camera has successfully started
      } catch (error) {
        console.error("Error accessing camera: ", error);
        alert("Could not start camera. Please ensure you have a camera and have granted permission.");
        cameraStarted = false;
      }
    }

    async function switchCamera() {
      if (!cameraStarted) return; // Prevent switching if camera hasn't started
      const cameras = await getCameras();
      if (cameras.length > 0) {
        cameraIndex = (cameraIndex + 1) % cameras.length;
        await startStream(cameras[cameraIndex].deviceId);
      } else {
        alert("No other cameras found.");
      }
    }

    document.getElementById('switchCameraButton').addEventListener('click', switchCamera);
    document.getElementById('visc').addEventListener('click', () => {
      // canvasElement.style.display = canvasElement.style.display === 'none' ? 'block' : 'none';
    });

    function isFingerUp(landmarks, tipIndex, pipIndex) {
      // Assuming index 0 is wrist for relative comparison, but generally
      // comparing tip to PIP joint's Y coordinate is sufficient for "up"
      // in a typical hand pose where fingers extend upwards.
      return landmarks[tipIndex].y < landmarks[pipIndex].y;
    }

    function countFingersUp(landmarks) {
      const up = {
        index: isFingerUp(landmarks, 8, 6),   // Index finger tip (8) vs PIP (6)
        middle: isFingerUp(landmarks, 12, 10), // Middle finger tip (12) vs PIP (10)
        ring: isFingerUp(landmarks, 16, 14)    // Ring finger tip (16) vs PIP (14)
      };

      const color = up.index ? 'white' : 'black';
      const radius = up.middle ? '100px' : '0px';
      const scale = up.ring ? 1.8 : 1;

      shapeBox.style.backgroundColor = color;
      shapeBox.style.borderRadius = radius;
      shapeBox.style.transform = `scale(${scale})`;

      // Get the bounding box of the hand for positioning the out_box
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      landmarks.forEach(lm => {
        minX = Math.min(minX, lm.x);
        minY = Math.min(minY, lm.y);
        maxX = Math.max(maxX, lm.x);
        maxY = Math.max(maxY, lm.y);
      });

      // Convert normalized coordinates to pixel coordinates
      const canvasWidth = canvasElement.width;
      const canvasHeight = canvasElement.height;

      const handCenterX = (minX + maxX) / 2.3 * canvasWidth;
      const handCenterY = (minY + maxY) / 2 * canvasHeight;

      // Position the shapeBox near the hand (adjust offset as needed)
      shapeBox.style.left = `${canvasElement.offsetLeft + handCenterX - (shapeBox.offsetWidth / 2)}px`;
      shapeBox.style.top = `${canvasElement.offsetTop + handCenterY - (shapeBox.offsetHeight / 2) - 50}px`; // Move it up slightly from center

      if (!gameOver && matchShapes({ color, radius, scale })) {
        score++;
        scoreEl.textContent = score;
        setNewTarget();
      }

    }

    function onResults(results) {
      if (gameOver) return;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      // Flip the canvas horizontally
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // Only consider the first hand if multiple hands are detected
        const landmarks = results.multiHandLandmarks[0];
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#FFF0FF', lineWidth: 1 });
        drawLandmarks(canvasCtx, landmarks, { color: '#9e5de8', lineWidth: .5 });

        countFingersUp(landmarks);
        shapeBox.style.display = 'block'; // Show the controlled shape when hand is detected
      } else {
        shapeBox.style.display = 'none'; // Hide if no hand is detected
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (!gameOver) { // Only send frames to hands if game is active
          await hands.send({ image: videoElement });
        }
      },
      width: 640,
      height: 480
    });

    function startGame() {
      score = 0;
      timeLeft = 30;
      gameOver = false;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      gameContainer.style.display = 'flex'; // Show game UI
      setNewTarget();

      if (!cameraStarted) {
        startStream(); // Start camera only if not already started
        camera.start(); // Start MediaPipe camera loop
      }

      clearInterval(countdownInterval); // Clear any existing interval
      countdownInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          timeEl.textContent = timeLeft;
        } else {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameOver = true;
      clearInterval(countdownInterval);
      finalScoreEl.textContent = score;
      if (score >= 10) {
        specialText.textContent = "ยอดเยี่ยม!";
      } else if (score >= 5) {
        specialText.textContent = "ดีมาก!";
      } else if (score >= 20) {
        specialText.textContent = "เว่อไปป่าววว!";
      } else if (score >= 25) {
        specialText.textContent = "ค้ตเว่อออ!";
      } else {
        specialText.textContent = "ไม่เป็นไรลองใหม่!";
      }
      gameContainer.style.display = 'none'; // Hide game UI
      gameOverScreen.style.display = 'flex'; // Show game over screen
    }

    startButton.addEventListener('click', startGame);// Replay button also calls startGame
  </script>
</body>

</html>
