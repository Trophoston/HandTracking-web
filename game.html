<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finger Shape Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #2e003e, #1a1a40);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .ui-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 1200px;
      padding: 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .top-bar button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      background-color: #5f27cd;
      color: white;
      cursor: pointer;
    }

    .zones {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
    }

    .zone {
      flex: 1;
      background-color: #341f97;
      padding: 1rem;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .output_canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .shape-box {
      width: 100px;
      height: 100px;
      background-color: white;
      transition: all 0.3s ease;
    }

    .score-timer {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-size: 1.5rem;
    }

    .out_box{
      position: absolute;

      filter: drop-shadow(0 0 0.75rem #ddd) opacity(.8);

      
    }

    @media (max-width: 768px) {
      .zones {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <div class="ui-container">
    <div class="top-bar">
      <button id="visc">Toggle Camera</button>
      <button id="switchCameraButton">Switch Camera</button>
      <div class="score-timer">
        <span>Score: <span id="score">0</span></span>
        <span>Time: <span id="time">30</span>s</span>
      </div>
    </div>

    <div class="zones">
      <div class="zone camera-zone">
        <video class="input_video" style="display: none;"></video>
        <canvas class="output_canvas" width="640px" height="480px"></canvas>

        <div class="shape-box out_box" id="shapeBox"></div>
        <!-- <p>Controlled Shape</p> -->
      </div>

      <div class="zone task-zone">
        <div class="shape-box" id="targetBox"></div>
        <!-- <p>Target Shape</p> -->
      </div>
    </div>
  </div>

  <script type="module">
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const shapeBox = document.getElementById('shapeBox');
    const targetBox = document.getElementById('targetBox');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');

    let currentStream;
    let cameraIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let gameOver = false;

    const targets = [
      { color: 'white', radius: '0px', scale: 1 },
      { color: 'white', radius: '100px', scale: 1 },
      { color: 'white', radius: '100px', scale: 1.5 },
      { color: 'black', radius: '100px', scale: 1.5 },
    ];

    let currentTarget = {};

    function setNewTarget() {
      currentTarget = targets[Math.floor(Math.random() * targets.length)];
      targetBox.style.backgroundColor = currentTarget.color;
      targetBox.style.borderRadius = currentTarget.radius;
      targetBox.style.transform = `scale(${currentTarget.scale})`;
    }

    function matchShapes(user) {
      return (
        user.color === currentTarget.color &&
        user.radius === currentTarget.radius &&
        user.scale === currentTarget.scale
      );
    }

    async function getCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter(device => device.kind === 'videoinput');
    }

    async function startStream(cameraId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: {
          deviceId: cameraId ? { exact: cameraId } : undefined
        }
      };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      videoElement.srcObject = currentStream;
    }

    async function switchCamera() {
      const cameras = await getCameras();
      cameraIndex = (cameraIndex + 1) % cameras.length;
      await startStream(cameras[cameraIndex].deviceId);
    }

    startStream();

    document.getElementById('switchCameraButton').addEventListener('click', switchCamera);
    document.getElementById('visc').addEventListener('click', () => {
      canvasElement.style.display = canvasElement.style.display === 'none' ? 'block' : 'none';
    });

    function isFingerUp(landmarks, tipIndex, pipIndex) {
      return landmarks[tipIndex].y < landmarks[pipIndex].y;
    }

    function countFingersUp(landmarks) {
      const up = {
        index: isFingerUp(landmarks, 8, 6),
        middle: isFingerUp(landmarks, 12, 10),
        ring: isFingerUp(landmarks, 16, 14)
      };

      const color = up.index ? 'white' : 'black';
      const radius = up.middle ? '100px' : '0px';
      const scale = up.ring ? 1.5 : 1;

      shapeBox.style.backgroundColor = color;
      shapeBox.style.borderRadius = radius;
      shapeBox.style.transform = `scale(${scale})`;

      if (!gameOver && matchShapes({ color, radius, scale })) {
        score++;
        scoreEl.textContent = score;
        setNewTarget();
      }
    }

    function onResults(results) {
      if (gameOver) return;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#FFF0FF', lineWidth: 1 });
          drawLandmarks(canvasCtx, landmarks, { color: '#9e5de8', lineWidth: .5 });

          countFingersUp(landmarks);
        }
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    setNewTarget();

    const countdown = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timeEl.textContent = timeLeft;
      } else {
        clearInterval(countdown);
        gameOver = true;
        alert(`Game Over! Your score: ${score}`);
      }
    }, 1000);
  </script>
</body>

</html>
